<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HAUSLINE Synchro Slider Preview</title><style>*{box-sizing:border-box}html,body{margin:0;background:#efe5dc;font-family:Arial,Helvetica,sans-serif;color:#2d251f}.wrap{max-width:1050px;margin:auto;padding:10px}.head{text-align:center;padding:8px 5px 10px}.head h1{margin:0 0 5px;font-size:21px}.head p{margin:0;color:#6e6259;font-size:13px}.stage{position:relative;overflow:hidden;border-radius:16px;background:#fff;box-shadow:0 12px 35px #0002;touch-action:none;user-select:none;cursor:grab}.stage.drag{cursor:grabbing}canvas{display:block;width:100%;height:auto;aspect-ratio:4/3}.tip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:9px 14px;border-radius:99px;background:#211c18dc;color:#fff;font-weight:700;font-size:13px;white-space:nowrap;pointer-events:none}.ctrl{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 0 3px}.ctrl button{min-height:44px;border:0;border-radius:11px;padding:10px 16px;background:#312923;color:#fff;font-weight:700;cursor:pointer}.ctrl input{flex:1;min-width:170px;accent-color:#8b5934}.pct{font-weight:700;min-width:82px;text-align:right}.note{text-align:center;color:#75685e;font-size:12px;padding:7px 4px 4px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f4eee9;color:#65594f;font-weight:700}.loading.hide{display:none}@media(max-width:600px){.wrap{padding:6px}.head h1{font-size:18px}.tip{font-size:11px;padding:8px 11px}.pct{width:100%;text-align:center}}</style></head><body><div class="wrap"><div class="head"><h1>HAUSLINE — Synchro Slider Preview</h1><p>Finger ya mouse se directly glass panels ko slide karein</p></div><div class="stage" id="stage"><canvas id="cv" width="1024" height="768"></canvas><div class="loading" id="loading">Loading preview…</div><div class="tip" id="tip">← Drag Left to Open</div></div><div class="ctrl"><button id="close" type="button">CLOSE</button><button id="half" type="button">HALF OPEN</button><button id="open" type="button">OPEN</button><input id="range" type="range" min="0" max="100" value="0" aria-label="Door opening percentage"><div class="pct" id="pct">0% Open</div></div><div class="note">Background fixed • blurred reveal image removed • only Synchro panels move</div></div><script>(()=>{const W=1024,H=768,stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),range=document.getElementById('range'),pct=document.getElementById('pct'),tip=document.getElementById('tip'),loading=document.getElementById('loading');let t=0,drag=false,startX=0,startT=0;const S=1024/1448;const top=86*S,bottom=940*S,height=bottom-top;const cropX=[394,614,834].map(v=>v*S),cropW=220*S,closedX=[394,614,834].map(v=>v*S),openX=[394,406,418].map(v=>v*S),rightBoundary=1054*S;const closed=new Image(),clamp=v=>Math.max(0,Math.min(1,v)),lerp=(a,b,k)=>a+(b-a)*k;function room(gx,gw){if(gw<=0)return;const innerTop=top+7,innerBottom=bottom-7,floorY=H*.68;ctx.save();ctx.beginPath();ctx.rect(gx,innerTop,gw,innerBottom-innerTop);ctx.clip();ctx.fillStyle='#eee9e5';ctx.fillRect(gx,innerTop,gw,Math.max(0,floorY-innerTop));const grad=ctx.createLinearGradient(0,floorY,0,innerBottom);grad.addColorStop(0,'#e9dfd6');grad.addColorStop(1,'#f0e5da');ctx.fillStyle=grad;ctx.fillRect(gx,floorY,gw,innerBottom-floorY);ctx.fillStyle='#8b6549';ctx.fillRect(gx,floorY-8,gw,8);ctx.strokeStyle='rgba(120,95,75,.15)';ctx.lineWidth=1;for(let x=gx;x<gx+gw;x+=90){ctx.beginPath();ctx.moveTo(x,floorY);ctx.lineTo(x,innerBottom);ctx.stroke()}ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(Math.min(gx+gw-45,gx+gw*.75),innerTop+55,5,0,Math.PI*2);ctx.fill();ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(closed,0,0,W,H);const rpx=lerp(closedX[2],openX[2],t),gapStart=rpx+cropW,gapW=Math.max(0,rightBoundary-gapStart);room(gapStart,gapW);for(let i=0;i<3;i++){const dx=lerp(closedX[i],openX[i],t);ctx.drawImage(closed,cropX[i],top,cropW,height,dx,top,cropW,height)}const p=Math.round(t*100);range.value=p;pct.textContent=p+'% Open';tip.textContent=p===0?'← Drag Left to Open':p===100?'Drag Right to Close →':'Sliding • '+p+'%'}function set(v){t=clamp(v);draw()}function animate(target){const a=t,s=performance.now(),d=320;function f(n){const p=Math.min(1,(n-s)/d),e=1-Math.pow(1-p,3);set(a+(target-a)*e);if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}stage.addEventListener('pointerdown',e=>{drag=true;startX=e.clientX;startT=t;stage.classList.add('drag');stage.setPointerCapture?.(e.pointerId);e.preventDefault()});stage.addEventListener('pointermove',e=>{if(!drag)return;const travel=Math.max(120,cv.getBoundingClientRect().width*.43);set(startT-(e.clientX-startX)/travel);e.preventDefault()});function up(e){drag=false;stage.classList.remove('drag');try{stage.releasePointerCapture?.(e.pointerId)}catch(_){}}stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);range.addEventListener('input',()=>set(+range.value/100));document.getElementById('close').onclick=()=>animate(0);document.getElementById('half').onclick=()=>animate(.5);document.getElementById('open').onclick=()=>animate(1);async function text(u){const r=await fetch(u+'?v=4',{cache:'no-store'});if(!r.ok)throw new Error('asset');return (await r.text()).trim()}Promise.all([text('c1.txt'),text('c2.txt')]).then(([c1,c2])=>new Promise(res=>{closed.onload=res;closed.src='data:image/webp;base64,'+c1+c2})).then(()=>{loading.classList.add('hide');draw()}).catch(()=>{loading.textContent='Preview could not load. Please refresh.'})})();</script></body></html>
